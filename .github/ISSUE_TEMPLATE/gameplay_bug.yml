name: Gameplay bug
description: Something went wrong while playing Blast Corps 2P
labels: ["bug", "gameplay"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! This is an experimental release, so every report helps.
        **Please do not attach ROMs or save files.**
  - type: input
    id: level
    attributes:
      label: Mission / level
      placeholder: e.g. Simian Acres
    validations:
      required: true
  - type: textarea
    id: p1
    attributes:
      label: What was Player 1 doing?
    validations:
      required: true
  - type: textarea
    id: p2
    attributes:
      label: What was Player 2 doing?
    validations:
      required: true
  - type: dropdown
    id: p2vehicle
    attributes:
      label: Player 2 vehicle
      options:
        - Ramdozer
        - Backlash
        - American Dream
        - On foot
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: start
    attributes:
      label: Did pressing START recover it?
      options:
        - "Yes"
        - "No"
        - Didn't try / not applicable
  - type: input
    id: setup
    attributes:
      label: Emulator / setup
      placeholder: e.g. Project64 3.0.1, local two controllers / Universal Couch
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video (optional)
      description: Drag images or a short clip here, or paste a link.
